receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  otlphttp:
    endpoint: http://abp-openobserve:5080/api/default
    headers:
      # DEV-27 (devops iter-0021): auth comes from the OPENOBSERVE_BASIC_AUTH
      # environment variable (set by docker-compose.middleware.yml) so this
      # config file carries no credential. It must match the OpenObserve root
      # credentials in that compose file; rotate them together.
      Authorization: ${env:OPENOBSERVE_BASIC_AUTH}
      stream-name: default

extensions:
  health_check:

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp]
