# ProjectName Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-name-api
  labels:
    name: project-name-api
spec:
  replicas: 1
  selector:
    matchLabels:
      name: project-name-api
  template:
    metadata:
      labels:
        name: project-name-api
    spec:
      # Kho image docker nội bộ
      # imagePullSecrets:
      # - name: internal-docker-repo
      containers:
      - name: project-name-api
        # DEV-02 iter-0012: scaffold template must not ship a floating :latest tag.
        # Replace 1.0.0 with the real release version when scaffolding a project.
        image: project-name-api:1.0.0
        env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Tự sửa nếu có vấn đề về múi giờ
            # - name: TZ
            #   value: "Asia/Ho_Chi_Minh"
        ports:
            - containerPort: 8080
        imagePullPolicy: Always
        livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
        volumeMounts:
            # Gắn appsettings
            # - mountPath: /app/appsettings.Production.json
            #   name: volume-cmkw2z
            #   subPath: appsettings.Production.json
            - mountPath: /app/Logs
              name: volume-xk3mds
              subPath: ./logs
            - mountPath: /app/Modules
              name: volume-xk3mds
              subPath: ./modules
      volumes:
        # Tự xử lý việc gắn các bộ nhớ khác
        - hostPath:
            path: /var/opt/project-name
            type: DirectoryOrCreate
          # Lưu ý đổi tên
          name: volume-xk3mds
        # Gắn appsettings
        # - configMap:
        #     defaultMode: 420
        #     name: project-name-api
        #   name: volume-cmkw2z

---
# ProjectName Service
kind: Service
apiVersion: v1
metadata:
  name: project-name-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
  selector:
    name: project-name-api

---
# ProjectName Ingress
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: project-name-api
spec:
  ingressClassName: nginx    
  rules:
  - host: "project-name-api.local"
    http:
        paths:
        # - path: /integration-api/project-name
        #   pathType: Prefix
        #   backend:
        #       service:
        #         name: project-name-api
        #         port:
        #           number: 8080
        - path: /api/project-name
          pathType: Prefix
          backend:
              service:
                name: project-name-api
                port:
                  number: 8080
