services:
  project-name-api:
    build:
      context: .
      dockerfile: host/PackageName.CompanyName.ProjectName.HttpApi.Host/Dockerfile
    hostname: project-name-api
    container_name: project-name-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Cổng mặc định của .NET, See: https://learn.microsoft.com/zh-cn/dotnet/core/compatibility/containers/8.0/aspnet-port
      # ASPNETCORE_HTTP_PORTS=8080
      # Tự sửa vấn đề múi giờ
      # - TZ=Asia/Shanghai
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost/healthz || exit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - /var/opt/project-name/logs:/app/Logs
      - /var/opt/project-name/modules:/app/Modules
