stages:
 - build
 - test
 - tag 
    
build_job:
 stage: build
 script:
  - echo "[ProjectName] - Build project..."
  - dotnet build --configuration Release
 only:
  - dev

test_job:
 stage: test
 script:
  - echo "[ProjectName] - Unit testing..."
  - dotnet test --no-build --configuration Release
 dependencies:
  - build_job
 only:
  - dev

tag_job:
  stage: tag
  only:
   - main
  script:
   - echo "[ProjectName] - Tag project..."
   # Lấy số phiên bản được định nghĩa trong common.props
   - export VERSION=$(sed -n 's/.*<Version>\([0-9]*\.[0-9]*\.[0-9]*\)<\/Version>.*/\1/p' common.props)
   - echo $VERSION
   
   # Tại đây thay yougitlab.com bằng máy chủ gitlab của bạn
   - git config --global user.email "ci@yougitlab.com"
   - git config --global user.name "GitLab CI Bot"

   - git tag -f $VERSION
   # Tại đây thay yougitlab.com bằng máy chủ gitlab của bạn, nếu chưa bật https, đổi thành http://oauth2:$GITLAB_TOKEN@yougitlab.com/$CI_PROJECT_PATH.git
   # Tại đây $GITLAB_TOKEN cần được cấu hình biến GITLAB_TOKEN trên máy chủ gitlab
   - git remote set-url origin https://oauth2:$GITLAB_TOKEN@yougitlab.com/$CI_PROJECT_PATH.git
   - git push --force origin $VERSION
