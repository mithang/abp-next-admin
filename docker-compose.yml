# DEV-21 (devops iter-0018): container timezone is Asia/Ho_Chi_Minh
# (UTC+7, Vietnam) in this file and in docker-compose.middleware.yml,
# docker-compose.override.agile.yml and docker-compose.allinone.yml.
# The previous value Asia/Shanghai (UTC+8) was upstream residue from the
# project's Chinese origin; it shifted container local time, log
# timestamps and local-time Quartz schedules by one hour versus the
# Vietnam deployment this fork targets. No application code references
# Asia/Shanghai (verified by grep over services/framework), so this is
# a compose-only change. Runtime verification still pending: real
# `docker compose up` on Linux (Docker BLOCKED on this VM).
version: '3.4'

services:
  auth-server:
    hostname: auth-server
    container_name: auth-server
    restart: unless-stopped
    # DEV-10 (devops iter-0007, provisional): single-service subset of
    # the AllInOne monolith (idle ~620-650 MB RSS, Debug, measured
    # iter-0003). 1g caps a runaway service with headroom over one
    # service's expected idle; cpus is a ceiling, not a reservation.
    # Needs verification by a real `docker compose up` + load (Docker BLOCKED).
    mem_limit: 1g
    cpus: 1.0
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "44385:80"
    networks:
      - abp-next-admin
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost/healthz || exit"]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth-server:host-gateway"

