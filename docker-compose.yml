    mem_limit: 512m
    cpus: 0.5
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "30000:80"
    # DEV-06 (devops iter-0015, CLOSED at file level): gateway was the
    # only base service without a healthcheck. Proven live this round
    # by running the gateway DLL standalone and probing /healthz:
    # no Redis configured -> 200 Degraded; Redis reachable ->
    # 200 Healthy; Redis configured but unreachable -> 503
    # Unhealthy. So in the base-only stack (no Redis:Configuration)
    # this wget check PASSES (Degraded maps to 200), and in the full
    # stack (override.configuration now points Redis at service DNS
    # abp-redis, DEV-18 iter-0016) an unhealthy result is a true
    # dependency signal, not a false positive. Same shape as the other
    # 11 services; wget inside the labp image still Needs verification
    # by `docker compose up` (Docker BLOCKED).
    # DEV-19 (devops iter-0016, FIXED): iter-0015's healthcheck edit
    # accidentally deleted the two lines below it (networks:
    # abp-next-admin and the extra_hosts header + first two entries),
    # leaving the remaining extra_hosts entries under `networks:`.
    # That made `docker compose config` fail (undefined networks) and
    # detached the gateway from the shared network. Restored verbatim
    # from HEAD; the healthcheck above is unchanged.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost/healthz || exit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abp-next-admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth-server:host-gateway"
      - "auth-server-api:host-gateway"
      - "localization-api:host-gateway"
      - "workflow-api:host-gateway"
      - "webhooks-api:host-gateway"
      - "wechat-api:host-gateway"
      - "messages-api:host-gateway"
      - "platform-api:host-gateway"
      - "tasks-api:host-gateway"
      - "admin-api:host-gateway"

