# DEV-18 (devops iter-0016, FIXED at file level — was OPEN since iter-0015):
# the 298 middleware-bound endpoints in this file that used host.docker.internal
# (MySQL connection strings + CAP MySql, CAP RabbitMQ + Elsa Rebus, Redis /
# DistributedLock, Elasticsearch, OTel, OpenObserve) now use compose service DNS
# (abp-mysql, abp-rabbitmq, abp-redis, abp-elasticsearch, abp-otel-collector,
# abp-openobserve). This is REQUIRED on native Linux Docker: DEV-17 binds every
# middleware published port to 127.0.0.1, and a 127.0.0.1-bound port does NOT
# accept connections to the bridge-gateway IP that host.docker.internal maps to,
# so container->middleware traffic via host.docker.internal connection-refused.
# Precondition (README documents it): middleware stack and backend stack both run
# with -p labp on network abp-next-admin, i.e. one shared network where these
# service names resolve. If you run middleware under a different project name,
# service DNS will NOT resolve — keep the project names in sync.
# Deliberately NOT changed: the 13 remaining host.docker.internal references are
# app-to-app (AuthServer ValidIssuers + RefreshClaimsUrl pointing at auth-server /
# identity-service host ports, NOT middleware) and must stay as they are.
# Runtime verification still pending: real `docker compose up` on Linux (Docker
# BLOCKED on this VM) must confirm every service boots and gateway /healthz is
# Healthy in the full stack. Do NOT revert DEV-17 to 0.0.0.0 as a workaround.

