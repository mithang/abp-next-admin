
user  root;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    server_names_hash_bucket_size 512;
    default_type  application/octet-stream;
    #Header tenant của abp cần mang dấu gạch dưới
    underscores_in_headers on;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$server_name" "$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile on;
    tcp_nopush on; # Kích hoạt lựa chọn socket TCP_CORK
    tcp_nodelay on; #Dữ liệu không đi qua bộ đệm trong quá trình truyền

    client_max_body_size     50m; # Tải lên file cần điều chỉnh kích thước request body
    client_header_timeout    1m;
    client_body_timeout      1m;
    proxy_connect_timeout     60s;
    proxy_read_timeout      1m;
    proxy_send_timeout      1m;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}