version: '3.4'

services:
  ui:
    # DEV-10 (devops iter-0007, provisional): static nginx
    # serving a built SPA; 256m is a generous dev cap. Needs
    # verification by a real `docker compose up` (Docker BLOCKED).
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
    restart: always
    environment:
      - VITE_GLOB_AUTHORITY=http://127.0.0.1:44385
    ports:
      - "40080:80"
    networks:
      - abp-next-admin

networks:
  abp-next-admin:
    driver: bridge